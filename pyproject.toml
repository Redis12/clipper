[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Clips YouTube : sélection par Claude, revue locale, publication programmée"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp[default]>=2025.11.0",
  "httpx>=0.27",
  "anthropic>=0.60",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",   # formulaires FastAPI (bouton Ajouter)
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pyyaml>=6",
  "python-dotenv>=1",
  "typer>=0.12",
  "pillow>=10.1",
  "opencv-python-headless>=4.9,<5",  # OpenCV 5 ne livre plus les cascades Haar
  "numpy>=1.26",
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  "tzdata; sys_platform == 'win32'",
  "qrcode>=7.4",               # QR code du lien téléphone
]

[project.optional-dependencies]
whisperx = ["whisperx>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:app"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = ["web/templates/*.html", "web/static/*", "assets/*"]
